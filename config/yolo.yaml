# YOLO long-option bot configuration.
# All scans are read-only; tickets are preview-only. No automatic submission.
budget_per_play: 1000.0
dte_min: 5
dte_max: 45
delta_min: 0.25
delta_max: 0.55
max_ask: 5.00
max_bid_ask_width_pct: 0.15
max_quote_age_seconds: 120
max_contracts: 10
universe:
  - SMCI
  - NVDA
  - AMD
  - TSLA
  - PLTR
  - COIN

# Exit engine thresholds (used by yolo-positions)
exit_rules:
  trim_profit_pct: 50.0
  sell_half_profit_pct: 100.0
  stop_loss_pct: -50.0
  theta_warning_dte: 3
  final_day_dte: 1
  # v2 (learned from the first SMCI round trip):
  # decent gain with the clock running out -> take it before theta does
  short_dte_take_profit_dte: 5
  short_dte_take_profit_pct: 20.0
  # after a 50%+ run, never give back more than this many percentage
  # points from the observed peak without locking gains
  trailing_giveback_pct: 25.0
  # Per-underlying thesis-dead levels. Calls: exit if spot drops below.
  # Puts: exit if spot rises above.
  thesis_dead_levels:
    SMCI: 27.0

# Fee model (tastytrade: $1.00/contract to open capped commissions,
# ~$0.13-0.15/contract regulatory+clearing to close)
fees:
  per_contract_close_fee: 0.15

